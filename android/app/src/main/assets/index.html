<script>
'use strict';
// ========== 参考数据（来源：《孕前和孕期保健指南2018》《妇产科学》第9版、中国营养学会膳食指南） ==========
const CHECKUP_SCHEDULE = [
  { week:"6-8周", name:"确认怀孕", items:["B超（胎心胎芽）","HCG","孕酮"], note:"确认宫内妊娠，排除宫外孕" },

  "血红蛋白": { min: 110,            unit: "g/L",    desc: "<110 妊娠贫血" },

  "尿蛋白":   { max: 0,              unit: "阴性",   desc: "阳性警惕子痫前期" },
  "胎心率":   { min: 110, max: 160,  unit: "次/分",  desc: "正常110-160" },

const DIET_GUIDE = {
  recommend: [
    { food:"深色蔬菜（菠菜、西兰花）", reason:"富含叶酸和铁", stage:"全程" },
    { food:"红肉、动物肝脏", reason:"补铁防贫血", stage:"中晚期" },
    { food:"牛奶、酸奶", reason:"补钙（日1000mg）", stage:"全程" },
    { food:"鸡蛋、深海鱼", reason:"优质蛋白+DHA", stage:"全程" },
    { food:"全谷物（燕麦、糙米）", reason:"膳食纤维防便秘", stage:"全程" },
    { food:"坚果（核桃、杏仁）", reason:"健康脂肪+维生素E", stage:"全程" },
    { food:"豆制品", reason:"植物蛋白+钙", stage:"全程" },
    { food:"水果（橙子、猕猴桃）", reason:"维生素C助铁吸收", stage:"全程" },
  ],
  avoid: [
    { food:"生鱼片、生肉、生蛋", reason:"弓形虫/沙门氏菌", severity:"🚫 绝对禁止" },
    { food:"酒精（任何含酒精饮品）", reason:"胎儿酒精综合征", severity:"🚫 绝对禁止" },
    { food:"未消毒奶制品/软奶酪", reason:"李斯特菌", severity:"🚫 绝对禁止" },
    { food:"高汞鱼类（鲨鱼、剑鱼等）", reason:"汞影响胎儿神经", severity:"🚫 绝对禁止" },
    { food:"咖啡因>200mg/天", reason:"增加流产风险", severity:"⚠️ 限量" },
    { food:"腌制食品/高盐食物", reason:"加重水肿高血压", severity:"⚠️ 限量" },
    { food:"高糖饮料/甜点", reason:"增加糖尿病风险", severity:"⚠️ 限量" },
  ],
  byCondition: {
    "贫血":    { advice:"多吃红肉、动物肝脏、菠菜、红枣、黑木耳，搭配Vc促进吸收", avoid:"浓茶、咖啡（抑制铁吸收）" },
    "血糖高":  { advice:"低GI饮食：燕麦糙米代替白米，少食多餐，先菜后饭", avoid:"含糖饮料、糕点、精制碳水" },
    "血压高":  { advice:"低盐<5g/天，多吃芹菜香蕉等富钾食物", avoid:"腌制食品、加工肉类" },
    "羊水少":  { advice:"多喝水>2000ml/天、豆浆、椰子水", avoid:"利尿食物（咖啡浓茶）" },
  },
};
const KNOWLEDGE = [
  { name:"NT检查", desc:"孕11-13周B超测量胎儿颈后透明层厚度，筛查唐氏综合征，正常<2.5mm" },
  { name:"唐筛", desc:"抽血+NT值计算唐氏风险概率，准确率约70%" },
  { name:"无创DNA", desc:"抽母血检测胎儿DNA，准确率>99%，自费约1000-3000元" },
  { name:"大排畸", desc:"孕20-24周系统B超，筛查胎儿结构畸形，最重要的一次B超" },
  { name:"OGTT", desc:"口服75g葡萄糖后测空腹/1h/2h血糖，筛查妊娠糖尿病" },
  { name:"NST", desc:"胎心监护，监测胎动时胎心率变化，评估胎儿宫内状况" },
  { name:"GBS筛查", desc:"孕36周阴道分泌物培养，阳性需分娩时用抗生素" },
  { name:"BPD/FL/HC/AC", desc:"B超测量胎儿双顶径/股骨长/头围/腹围，评估胎儿发育" },
];
const DEFAULT_ITEMS = ["收缩压","舒张压","体重","宫高","腹围","胎心率","血红蛋白","空腹血糖","尿蛋白","羊水指数","双顶径","股骨长","头围","胎盘位置","胎位"];
// ========== 数据 ==========
const KEY = 'preg_assist_v1';
let D = load();
function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r) return r; } catch(e){}
  return { profile: null, records: [], expenses: [], settings: { apiKey: '', visionKey: '7bb5d14a688646c184203124a4e5dd41.sp3phdIxlOCUYUHQ' } };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e){} }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
// ========== UI 工具 ==========
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k];
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== undefined && v !== null) el.setAttribute(k, v);
  }
  for (const c of kids) {
    if (c === null || c === undefined) continue;
    if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(String(c)));
    else el.appendChild(c);
  }
  return el;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// ========== 孕周计算 ==========
function calcWeeks() {
  const p = D.profile; if (!p) return null;
  const lmp = new Date(p.lmp); const now = new Date();
  if (isNaN(lmp.getTime())) return null;
  const days = Math.max(0, Math.floor((now - lmp) / 86400000));
  const wks = Math.floor(days / 7), dys = days % 7;
  const edd = new Date(p.edd); const remain = edd ? Math.max(0, Math.ceil((edd - now) / 86400000)) : null;
  return { days, wks, dys, remain, edd };
}
function nextCheckup(wks) {
  return CHECKUP_SCHEDULE.find(s => {
    const nums = s.week.replace('周','').split('-').map(Number);
    const lo = nums[0] || 0, hi = nums[1] || lo;
    return wks < hi;
  }) || null;
}
// ========== 判定 ==========
function judge(key, val) {
  const ref = NORMAL_RANGES[key];
  if (!ref || typeof val !== 'number') return null;
  if ((ref.min !== undefined && val < ref.min) || (ref.max !== undefined && val > ref.max)) return 'bad';
  return 'ok';
}
function abnormalKeys(record) {
  const list = [];
  for (const k in (record.items||{})) {
    const v = record.items[k];
    if (typeof v === 'number' && judge(k, v) === 'bad') list.push(k);
  }
  return list;
}
// ========== 规则引擎 AI 解读（离线） ==========
function ruleInterpret(record, profile) {
  let out = '📋 本次检查自动解读（规则引擎）：\n\n';
  const items = record.items || {};
  let any = false;
  for (const k in items) {
    const v = items[k];
    if (v === undefined || v === null || v === '') continue;
    const ref = NORMAL_RANGES[k];
    if (ref) {
      const st = judge(k, v);
      if (st === 'bad') { out += `🔴 ${k}：${v} ${ref.unit||''}（异常${ref.desc ? '——' + ref.desc : ''}）\n`; any = true; }
      else out += `🟢 ${k}：${v} ${ref.unit||''}（正常范围 ${ref.min??'-'}~${ref.max??'-'}）\n`;
    } else {
      out += `⚪ ${k}：${v}\n`;
    }
  }
  if (!any) out += '\n✅ 本次检查未发现超出参考范围的项目。\n';
  out += '\n⚠️ 本解读由内置规则自动生成，仅供参考，不能替代医生诊断。如有异常请及时就医。';
  return out;
}
function ruleDiet(profile) {
  const p = profile || D.profile || {};
  let out = '🍽️ 个性化饮食建议（根据孕周与检查结果）：\n\n';
  const wks = p.wks;
  if (wks !== undefined && wks !== null) {
    if (wks < 14) out += '▪️ 孕早期（<14周）：重点补充叶酸（400μg/天），多吃深色蔬菜、豆类，清淡饮食缓解孕吐。\n';
    else if (wks < 28) out += '▪️ 孕中期（14-28周）：胎儿生长加速，增加蛋白质和钙（每日1000mg），注意补铁。\n';
    else out += '▪️ 孕晚期（>28周）：控制体重增速，少食多餐，补充铁和DHA，为分娩储备能量。\n';
  }
  // 根据最近检查异常调整
  if (D.records.length) {
    const latest = D.records.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const conds = [];
    const it = latest.items||{};
    if (typeof it['血红蛋白']==='number' && it['血红蛋白']<110) conds.push('贫血');
    if (typeof it['空腹血糖']==='number' && it['空腹血糖']>5.1) conds.push('血糖高');
    if (typeof it['收缩压']==='number' && it['收缩压']>140) conds.push('血压高');
    if (typeof it['羊水指数']==='number' && it['羊水指数']<8) conds.push('羊水少');
    for (const c of conds) {
      const g = DIET_GUIDE.byCondition[c];
      if (g) { out += `\n⚠️ 检测到「${c}」：\n  ✅ ${g.advice}\n  ❌ ${g.avoid}\n`; }
    }
  }
  return out;
}
// ========== 可选 DeepSeek API（设置中填 key 后启用） ==========
async function deepseekAsk(prompt, system) {
  const key = (D.settings && D.settings.apiKey) || '';
  if (!key) return null;
  try {
    const r = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [
        { role: 'system', content: system || '你是孕期健康顾问。' },
        { role: 'user', content: prompt }
      ], max_tokens: 1500, temperature: 0.3 })
    });
    const j = await r.json();
    if (j && j.choices && j.choices[0]) return j.choices[0].message.content;
    return '（API 返回异常：' + (j.error ? j.error.message : '未知错误') + '）';
  } catch(e) {
    return '（AI 调用失败：' + e.message + '）';
  }
}

const UPDATE_URL = 'https://cdn.jsdelivr.net/gh/zyk0379/pregnancy-assistant-apk@main/version.json';
const APK_URL = 'https://cdn.jsdelivr.net/gh/zyk0379/pregnancy-assistant-apk@main/pregnancy-assistant.apk';
function checkUpdate() {
  const st = document.getElementById('update_status');
  if (st) st.textContent = '⏳ 正在检查更新...';
  fetch(UPDATE_URL, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => {
      if (!st) return;
      if (j.version && j.version !== APP_VERSION) {
        st.innerHTML = '🎉 发现新版本 v' + j.version + '！' + (j.date ? '（' + j.date + '）' : '');
        if (confirm('发现新版本 v' + j.version + '，是否立即下载更新？')) {
          window.open(APK_URL, '_blank');
        }
      } else {
        st.textContent = '✅ 已是最新版本 v' + APP_VERSION;
      }
    })
    .catch(e => { if (st) st.textContent = '❌ 检查失败（网络问题），可稍后重试'; });
}

  { name:'OGTT 1h血糖', pat:/餐后1\s*小时|1\s*h\s*血糖|OGTT1/i, num:/(\d+\.?\d*)/, use:v=>v[1] },
  { name:'OGTT 2h血糖', pat:/餐后2\s*小时|2\s*h\s*血糖|OGTT2/i, num:/(\d+\.?\d*)/, use:v=>v[1] },
  { name:'血红蛋白', pat:/血红蛋白|HGB|Hb/i, num:/(\d{2,3})/, use:v=>v[1] },
  { name:'NT值', pat:/NT\s*值|颈后透明|NT/i, num:/(\d+\.?\d*)/, use:v=>v[1] },
  { name:'羊水指数', pat:/羊水指数|AFI/i, num:/(\d+\.?\d*)/, use:v=>v[1] },

];
// 加载 pdf.js（CDN，需联网；加载失败提示）
let pdfjsLoaded = false;
function loadPdfJs() {
  return new Promise((resolve, reject) => {
    if (window.pdfjsLib) { pdfjsLoaded = true; resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; pdfjsLoaded = true; resolve(); };
    s.onerror = () => reject(new Error('PDF解析库加载失败，请检查网络'));
    document.head.appendChild(s);
  });
}
function openPdfImport() {
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = '.pdf,application/pdf';
  fi.onchange = () => { if (fi.files && fi.files[0]) parsePdf(fi.files[0]); };
  fi.click();
}
async function parsePdf(file) {
  const box = h('div', {class:'modal-ov'}, h('div', {class:'modal'},
    h('b', {style:{fontSize:'16px'}}, '⏳ 正在解析PDF...'),
    h('div', {style:{fontSize:'12px',color:'#64748b',marginTop:'8px'}}, '请稍候，正在提取文字内容')));
  document.body.appendChild(box);
  try {
    await loadPdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: buf, disableWorker: true }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      text += tc.items.map(it => it.str || '').join(' ') + '\n';
    }
    box.remove();
    if (!text.trim()) { alert('未从PDF中提取到文字。若为扫描件（图片型PDF），暂不支持识别，可手动录入。'); return; }
    showPdfResult(file.name, text);
  } catch(e) {
    box.remove();
    alert('PDF解析失败：' + (e.message || e) + '\n\n提示：电子版PDF可提取文字；扫描件（图片）暂不支持。');
  }
}
// 从文本中提取检查项目
function extractItems(text) {
  const items = {};
  for (const rule of PDF_EXTRACT_RULES) {
    // 找到含项目名的行/段，取其附近数值
    const lines = text.split(/[\n\r]/);
    for (const line of lines) {
      if (rule.pat.test(line)) {
        const m = line.match(rule.num);
        if (m) { items[rule.name] = rule.use(m); break; }
      }
    }
  }
  return items;
}

// 图片压缩（拍照图可能很大，压缩到最长边1500）
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      const max = 1500;
      if (Math.max(width, height) > max) {
        const ratio = max / Math.max(width, height);
        width = Math.round(width * ratio); height = Math.round(height * ratio);
      }
      const cv = document.createElement('canvas');
      cv.width = width; cv.height = height;
      cv.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = reject;
    img.src = url;
  });
}
// 调智谱 GLM-4V
async function callZhipuVision(base64Img, prompt) {
  const key = (D.settings||{}).visionKey || '';
  const p = (D.settings||{}).visionProxy || '';
  const url = p ? (location.origin + '/zhipu-proxy') : 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
  const body = { model: 'glm-4v-flash', messages: [{ role: 'user', content: [
    { type: 'text', text: prompt },
    { type: 'image_url', image_url: { url: base64Img } }
  ]}], max_tokens: 1024, temperature: 0.1 };
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(body) });
  if (!r.ok) { const j = await r.json().catch(()=>({})); throw new Error('API错误 ' + r.status + ': ' + (j.error ? JSON.stringify(j.error).slice(0,100) : '')); }
  const j = await r.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
}
function parseItemsJson(text) {
  let t = String(text).replace(/```json|```/g, '').trim();
  try {
    const j = JSON.parse(t);
    const items = j.items || j;
    const out = {};
    for (const k in items) { const v = items[k]; if (v !== null && v !== '' && v !== undefined) out[k] = v; }
    const exp = (j.expense && j.expense.amount) ? j.expense : null;
    const refs = j.refs || {};
    const refOut = {};
    for (const k in refs) { const v = refs[k]; if (v !== null && v !== '' && v !== undefined) refOut[k] = String(v); }
    return { items: out, expense: exp, refs: refOut };
  } catch(e) { return null; }
}
async function visionRecognize(file, pdfText) {
  const box = h('div', {class:'modal-ov'}, h('div', {class:'modal'},
    h('b', {style:{fontSize:'16px'}}, '⏳ AI 识别中...'),
    h('div', {style:{fontSize:'12px',color:'#64748b',marginTop:'8px'}}, '正在让 AI 看懂检查单，请稍候（约10-30秒）')));
  document.body.appendChild(box);
  try {
    const base64 = file ? await compressImage(file) : null;
    const prompt = '你是一位医学检验单识别助手。请识别这张孕期检查单/化验单/彩超报告上的所有检查项目、结果数值、参考值范围，以及费用信息。' +
      '严格输出JSON格式（不要任何其他文字）：{"items":{"项目名称":结果数值},"refs":{"项目名称":"参考范围如 3.5-5.1 或 阴性/阳性"},"expense":{"amount":金额数字,"note":"费用说明"}}。' +
      '要求：项目名称用中文（如"收缩压""血红蛋白""双顶径"），结果数值保持原样如"120/80"或"5.2"。' +
      '重点：报告单上通常有"参考值/参考范围/正常值"一列，必须把这一列提取到refs里（如"3.5-5.1""<5.1""阴性"），每个项目都要有refs；如果单据上没有参考值列则refs可以为空对象。' +
      '如果是费用票据（缴费单/收据/发票），items输出空对象{}，只提取expense。票据上常有多个金额：医保统筹支付、现金、POS、支付宝/微信、医保账户等。expense.amount必须填"实际支付金额"=支付宝/微信/现金/POS等支付方式的金额（不是统筹报销！）。note填支付方式名。如果是检验单则expense填null。' +
      (pdfText ? '同时参考以下PDF提取文字辅助识别（可能是乱序文本）：' + pdfText.slice(0,1500) : '');
    let raw = await callZhipuVision(base64, prompt);
    box.remove();
    const parsed = parseItemsJson(raw);
    if (!parsed || !Object.keys(parsed.items).length) {
      const body = h('div', {},
        h('div', {style:{fontSize:'12px',color:'#64748b',marginBottom:'6px'}}, 'AI 未能自动提取结构化数据，以下是识别文本（可复制或编辑）：'),
        h('textarea', {class:'inp', style:{height:'180px'}}, raw),
        h('div', {style:{fontSize:'11px',color:'#94a3b8'}}, '提示：可把内容手动填入「+ 添加记录」，或用下面按钮保存为备注'));
      showModal('🤖 AI 识别结果', body, null);
      return;
    }
    showVisionConfirm(parsed.items, parsed.expense, parsed.refs);
  } catch(e) {
    box.remove();
    alert('识别失败：' + (e.message || e) + '\n\n提示：\n1. 检查网络\n2. 确认设置了视觉识别 Key\n3. 若为浏览器打开，需用 APK 版或本机服务器版');
  }
}
function collectVisionItems(found) {
  const finalItems = {};
  found.forEach(k => { const el = document.getElementById('vx_'+k); if (el && el.value !== '') { const n = parseFloat(el.value); finalItems[k] = isNaN(n)?el.value:n; } });
  return finalItems;
}
function collectVisionExpense() {
  const amtEl = document.getElementById('vx_exp_amt');
  if (!amtEl || !amtEl.value) return null;
  return { id: uid(), date: new Date().toISOString().slice(0,10), category: (document.getElementById('vx_exp_cat')||{}).value || '检查费', amount: parseFloat(amtEl.value) || 0, selfPaid: false, note: (document.getElementById('vx_exp_note')||{}).value || '' };
}
function showVisionConfirm(items, expense, refs) {
  refs = refs || {};
  const found = Object.keys(items);
  const hasExp = !!(expense && expense.amount);
  const body = h('div', {},
    h('b', {style:{fontSize:'16px'}}, '🔍 AI 识别到 ' + found.length + ' 项' + (hasExp ? ' + 💰费用' : '')),
    h('div', {style:{fontSize:'11px',color:'#94a3b8',margin:'4px 0 8px'}}, '请核对修改数值（AI识别可能有误差）：'),
    ...found.map(k => h('div', {class:'row', style:{marginBottom:'4px'}},
      h('label',{class:'lbl',style:{minWidth:'90px',flex:'none',alignSelf:'center'}}, k),
      h('input',{class:'inp',style:{flex:1},id:'vx_'+k,value:items[k]}),
      refs[k] ? h('span',{style:{fontSize:'10px',color:'#94a3b8',alignSelf:'center',flex:'none'}}, '参考值:'+refs[k]) : null)),
    hasExp ? h('div', {style:{marginTop:'8px',paddingTop:'10px',borderTop:'1px solid #f1f5f9'}},
      h('b', {style:{fontSize:'14px'}}, '💰 识别到费用（可修改）'),
      h('div', {class:'row', style:{marginTop:'6px'}},
        h('div', {class:'col'}, h('label',{class:'lbl'},'金额(元)'), h('input',{class:'inp',type:'number',id:'vx_exp_amt',value:expense.amount})),
        h('div', {class:'col'}, h('label',{class:'lbl'},'类别'), h('select',{class:'inp',id:'vx_exp_cat'}, ...['挂号费','检查费','B超费','化验费','药品费','其他'].map(c=>h('option',{value:c,selected:c===(expense.note||'')},c))))),
      h('label',{class:'lbl'},'备注'), h('input',{class:'inp',id:'vx_exp_note',value:(expense.note||'').slice(0,60)}),
    ) : null,
    h('div', {style:{display:'flex',gap:'8px',marginTop:'10px'}},
      h('button', {class:'btn btn-s', onclick:()=>{ modalVisionDate(body, found, expense, refs); }}, '下一步 ⏭'),
      h('button', {class:'btn btn-p', onclick:()=>{
        const finalItems = collectVisionItems(found);
        const exp = collectVisionExpense();
        const r = { id: uid(), date: new Date().toISOString().slice(0,10), week:'', hospital:'', doctor:'', items: finalItems, refs: refs, notes: 'AI拍照识别导入' };
        D.records.push(r);
        if (exp) D.expenses.push(exp);
        save(); render(); alert('✅ 已保存 ' + found.length + ' 项' + (exp ? ' + 费用¥' + exp.amount : '') + '，可在「检查记录」中编辑！');
      }}, '💾 直接保存')));
  const ov = h('div', {class:'modal-ov'}, h('div', {class:'modal'}, body));
  document.body.appendChild(ov);
}
// 拍照识别第二步：确认日期/孕周后保存
function modalVisionDate(body, found, expense, refs) {
  const finalItems = collectVisionItems(found);
  const body2 = h('div', {},
    h('div', {style:{fontSize:'12px',color:'#64748b',marginBottom:'8px'}}, '补充检查日期和孕周（可跳过）：'),
    h('label',{class:'lbl'},'检查日期'), h('input',{class:'inp',type:'date',id:'vd_date',value:new Date().toISOString().slice(0,10)}),
    h('label',{class:'lbl'},'孕周'), h('input',{class:'inp',id:'vd_week',placeholder:'如：24周+3天'}),
    h('div', {style:{display:'flex',gap:'8px',marginTop:'10px'}},
      h('button', {class:'btn btn-s', onclick:()=>ov2.remove()}, '返回'),
      h('button', {class:'btn btn-p', onclick:()=>{
        const r = { id: uid(), date:(document.getElementById('vd_date')||{}).value||new Date().toISOString().slice(0,10), week:(document.getElementById('vd_week')||{}).value||'', hospital:'', doctor:'', items: finalItems, refs: refs||{}, notes: 'AI拍照识别导入' };
        D.records.push(r);
        const exp = collectVisionExpense();
        if (exp) { exp.date = r.date; D.expenses.push(exp); }
        save(); render(); alert('✅ 已保存 ' + found.length + ' 项' + (exp ? ' + 费用¥' + exp.amount : '') + '！');
      }}, '💾 保存')));
  const ov2 = h('div', {class:'modal-ov'}, h('div', {class:'modal'}, body2));
  document.body.appendChild(ov2);
}
// ========== 底部安全区兜底 ==========
function fixLayout() {
  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  const content = document.getElementById('content');
  if (!app || !tabs || !content) return;
  // 动态视口高度
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  app.style.height = vh + 'px';
  // 确保 tabs 可见：content 弹性收缩
  const tabsH = tabs.offsetHeight;
  content.style.maxHeight = (vh - tabsH - 80) + 'px';
}
window.addEventListener('resize', fixLayout);
window.addEventListener('load', fixLayout);
setTimeout(fixLayout, 300);
// ========== 初始化 ==========
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
render();
</script>
